# Static analysis for the whole package.
#
# The gate is deliberately staged, because this repository is a fork with a long
# history and an `upstream` remote. A large mechanical reformat would conflict
# on every sync for no correctness gain, so this file escalates one rule at a
# time and only once that rule is actually clean.
#
#   errors   -> FATAL (analyzer default)
#   warnings -> FATAL (analyzer default; the warning count is now 0)
#   infos    -> reported, NOT fatal — the remaining backlog
#
# To make infos fatal later, add `--fatal-infos` to the CI analyze step, or run
# `dart fix --apply` until the info count is zero. Nothing else needs to change.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Generated by `flutter gen-l10n` and overwritten on every run: linting it
    # is pure waste, and a finding there is not fixable in review.
    - lib/l10n/app_localizations*.dart
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.config.dart"
    - "**/*.mocks.dart"

  errors:
    # --- Escalated to fatal. Each was at zero occurrences when added, so this
    # --- costs nothing today and blocks the regression from coming back.
    #
    # Silent correctness bugs, not style:
    #
    #  - A stale `@override` means the member no longer exists on the
    #    implemented interface, so the call falls through to `noSuchMethod` and
    #    the test passes without exercising anything.
    #  - An un-awaited future returned from a `try` block cannot be caught by
    #    that block's `catch`: the `return` happens before the future settles,
    #    so a guard documented as "never throws" silently does nothing.
    override_on_non_overriding_member: error
    invalid_use_of_protected_member: error
    invalid_use_of_visible_for_testing_member: error
    unawaited_return_in_try_block: error

    # --- Next target, NOT yet escalated ------------------------------
    #
    # `use_build_context_synchronously` is the single highest-value rule for
    # this codebase: reaching a BuildContext after an await throws at runtime
    # rather than failing a build, so nothing downstream catches it. There are
    # currently 70 occurrences, so making it fatal now would turn CI red on the
    # first run — which is how gates get ignored.
    #
    # Fix them (each needs a real `if (!context.mounted) return;` guard, not an
    # ignore), then promote the line below to `: error` in the same commit that
    # takes the count to zero.
    # use_build_context_synchronously: error

    # --- Still riding as infos, deliberately -------------------
    #
    # The mechanical backlog, left alone until it is worth the diff:
    #   unnecessary_import, unnecessary_underscores,
    #   curly_braces_in_flow_control_structures, use_null_aware_elements,
    #   prefer_interpolation_to_compose_strings, annotate_overrides,
    #   no_leading_underscores_for_local_identifiers, unused_element,
    #   deprecated_member_use

linter:
  # No extra rules are enabled on top of `flutter_lints` yet. A wider ruleset was
  # trialled and rejected: `always_declare_return_types` alone reported ~170
  # findings, almost all `noSuchMethod` in test fakes, which is exactly the
  # mechanical churn the staged approach exists to avoid.
  #
  # `avoid_print` is not enabled either — the JS-provider runtime logs to stdout
  # on purpose, where `debugPrint` is unavailable.
  rules:
    # avoid_print: true
    # require_trailing_commas: true
    # prefer_single_quotes: true