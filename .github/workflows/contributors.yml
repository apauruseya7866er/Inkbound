name: Contributors

# Regenerates the roster in CONTRIBUTORS.md from git history.
#
# The point is that the list is never hand-maintained: a name is present because
# the person committed code, so it cannot go stale or be forgotten. Runs weekly
# and on demand; only opens a pull request when the generated block actually
# differs from what is committed.
on:
  schedule:
    # Sunday 04:17 UTC. An off-the-hour minute avoids the rush at :00.
    - cron: '17 4 * * 0'
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'CONTRIBUTORS.md'
      - '.github/workflows/contributors.yml'

permissions:
  contents: write
  pull-requests: write

# Only one regeneration at a time, and never cancel one mid-run.
concurrency:
  group: contributors
  cancel-in-progress: false

jobs:
  update:
    name: Refresh the contributors roster
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Full history, not a shallow clone: the roster counts every commit the
      # project has ever had, including the upstream years that are not reachable
      # from this branch's recent history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the roster
        run: python scripts/generate_contributors.py

      # Non-fatal on purpose. Creating a pull request as an action needs
      # "Allow GitHub Actions to create and approve pull requests" enabled in
      # Settings -> Actions -> General, which is off by default - and this job
      # must not sit permanently red waiting on a repository setting. The roster
      # is a convenience; the authoritative record is the git history either way.
      - name: Open a pull request if anything changed
        id: pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          # Falls back to the workflow token when no fine-grained token is set,
          # which works once the repository setting above is enabled.
          token: ${{ secrets.CONTRIBUTORS_PR_TOKEN || secrets.GITHUB_TOKEN }}
          base: ${{ github.ref_name }}
          branch: automation/contributors-roster
          commit-message: 'chore: refresh the contributors roster'
          title: 'chore: refresh the contributors roster'
          body: |
            Regenerated from `git shortlog` by the Contributors workflow.

            No hand-editing needed - if your name is missing, it is because your
            commits are not attributed to an email linked to a GitHub account.
            Fix that on your GitHub profile, then re-run this workflow.
          delete-branch: true
          labels: automation

      - name: Explain how to enable roster updates
        if: steps.pr.outcome == 'failure' && github.ref_name == github.event.repository.default_branch
        run: |
          echo "::warning::Could not open the roster pull request."
          echo "::warning::Either enable 'Allow GitHub Actions to create and approve"
          echo "::warning::pull requests' in Settings -> Actions -> General, or add a"
          echo "::warning::CONTRIBUTORS_PR_TOKEN secret holding a fine-grained token with"
          echo "::warning::'Contents: write' and 'Pull requests: write' on this repository."
          echo "::warning::Until then the roster is regenerated locally with:"
          echo "::warning::  python scripts/generate_contributors.py"

      - name: Fail if the roster could not be generated
        if: failure()
        run: echo "::error::Roster generation failed - CONTRIBUTORS.md may be stale."